name: Report diagnostics
# SOURCE PREPARATION ONLY: owner approval after reviewed PR is required before dispatch.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed Live journeys run ID (positive decimal, at most 15 digits)
        type: string
        required: true
      attempt:
        description: Exact attempt (positive decimal, at most 4 digits)
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  diagnostics:
    if: github.repository == 'dinkuskit/live-journeys' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
        working-directory: runner
    env:
      SELECTED_RUN: ${{ inputs.run_id }}
      SELECTED_ATTEMPT: ${{ inputs.attempt }}
      DINKUS_E2E_ENV_FILE: /dev/null
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.0"
      - name: Verify selected run before any R2 read
        env:
          GH_TOKEN: ${{ github.token }}
        run: env -i PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" GH_TOKEN="$GH_TOKEN" node scripts/report-diagnostics.mjs verify "$SELECTED_RUN" "$SELECTED_ATTEMPT"
      - name: Read only the bounded selected report
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: env -i PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" R2_ACCOUNT_ID="$R2_ACCOUNT_ID" R2_BUCKET="$R2_BUCKET" node scripts/report-diagnostics.mjs fetch "$SELECTED_RUN" "$SELECTED_ATTEMPT"
      - name: Publish allowlisted diagnostics without credentials
        run: |
          env -i PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" node scripts/report-diagnostics.mjs analyze "$SELECTED_RUN" "$SELECTED_ATTEMPT" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Remove private temporary files
        if: always()
        run: env -i PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" node scripts/report-diagnostics.mjs clean "$SELECTED_RUN" "$SELECTED_ATTEMPT"
