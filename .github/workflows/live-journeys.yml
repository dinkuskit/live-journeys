name: Live journeys
# A run a release started names its beta on the Actions page.
run-name: Live journeys${{ inputs.beta && format(' for {0}', inputs.beta) || '' }}
# Runs the DinkusKit live journeys (runner/) against the beta test store,
# beta.sm0ky.dev, on a GitHub runner. It never runs on pull requests or pushes: only from the
# "Run workflow" button, which a plugin's Cut beta also presses once it has published a beta. This
# store belongs to this workflow alone; no Mac or other computer runs journeys on it. Stripe TEST
# cards and Ship sandbox labels only. Before the journeys it updates the store's DinkusKit beta
# plugins to the newest betas, and stops if an update asks for new permissions.
#
# The job log is public, so it shows only each journey's pass or fail, the plugin versions tested, why
# a store update stopped and, for a journey that failed, its step names with each step's pass or fail
# and one fixed kind of failure. What each step found, screenshots, the console output and videos go
# to the private R2 bucket.

on:
  workflow_dispatch:
    inputs:
      # TEMPORARY PR 39 qualification; remove this mode after authorized proof.
      diagnostics_qualification:
        description: Owner-approved diagnostics qualification only (skips all live journeys)
        type: boolean
        default: false
      diagnostics_expected_head:
        description: Full reviewed branch commit approved for the one qualification run
        type: string
        default: ""
        required: false
      journeys:
        description: Which journeys (a Playwright --grep; @running runs every Running journey)
        default: "@running"
        required: true
      update_store:
        description: First update the store's DinkusKit plugins to the newest betas (stops if one asks for new permissions)
        type: boolean
        default: true
      beta:
        description: The beta a release just published, as "dinkus-<plugin>-beta <version>" (Cut beta fills this in; the update waits for the Registry to offer it)
        default: ""
        required: false
      hold:
        description: Beta listings to keep on what the store runs, as "dinkus-<plugin>-beta" (for a beta the Registry won't serve yet; the summary says it was held)
        default: ""
        required: false
      video:
        description: Record a video of every browser window
        type: boolean
        default: false

permissions:
  contents: read

# One run on the store at a time. A press while a run is going waits its turn; GitHub keeps only
# one waiting run, so a further press replaces the waiting one (and its choices).
concurrency:
  group: ${{ inputs.diagnostics_qualification && format('report-qualification-{0}', github.run_id) || 'live-journeys-beta-store' }}
  cancel-in-progress: false

jobs:
  journeys:
    name: Journeys on beta.sm0ky.dev
    if: github.repository == 'dinkuskit/live-journeys' && !inputs.diagnostics_qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    env:
      DINKUS_E2E_STORE: https://beta.sm0ky.dev
      DINKUS_E2E_SITE_ID: 858232f9-bc07-44f6-b3de-259a8055a9dd
      DINKUS_E2E_ORDERS_ADMIN: https://beta.sm0ky.dev/_emdash/admin/plugins/r_fjzjvld3ssb4j63o/orders
      DINKUS_E2E_ACCESS_ORIGINS: https://sm0kydev.cloudflareaccess.com
      DINKUS_E2E_MAIL_CMD: node "$GITHUB_WORKSPACE/runner/scripts/gmail-mail.mjs"
      # Nobody watches a GitHub run, so the runner fails at once where it would wait for a person.
      DINKUS_E2E_HEADLESS: "1"
      DINKUS_E2E_VIDEO: ${{ inputs.video && '1' || '0' }}
      DINKUS_E2E_RUN: github-${{ github.run_id }}-${{ github.run_attempt }}
      # Points at an empty file, so nothing on the runner's disk can add settings.
      DINKUS_E2E_ENV_FILE: /dev/null
      PROOF_PREFIX: runs/github-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        # Named, so GitHub adds pipefail: a failing command before a pipe fails its step.
        shell: bash
        working-directory: runner

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.0"

      - name: Install the runner and the label PDF renderer
        timeout-minutes: 10
        run: |
          # A fresh Chrome profile and proof folder for every run, outside the checkout.
          echo "DINKUS_E2E_PROOF=$RUNNER_TEMP/proof" >> "$GITHUB_ENV"
          echo "DINKUS_E2E_PROFILE=$RUNNER_TEMP/profile" >> "$GITHUB_ENV"
          npm ci
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Check the settings
        run: |
          missing=0
          for name in DINKUS_E2E_OWNER_EMAIL DINKUS_E2E_GMAIL_CLIENT_ID DINKUS_E2E_GMAIL_CLIENT_SECRET DINKUS_E2E_GMAIL_REFRESH_TOKEN R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!name}" ]; then echo "::error::The repository secret $name is not set."; missing=1; fi
          done
          exit $missing
        env:
          DINKUS_E2E_OWNER_EMAIL: ${{ secrets.DINKUS_E2E_OWNER_EMAIL }}
          DINKUS_E2E_GMAIL_CLIENT_ID: ${{ secrets.DINKUS_E2E_GMAIL_CLIENT_ID }}
          DINKUS_E2E_GMAIL_CLIENT_SECRET: ${{ secrets.DINKUS_E2E_GMAIL_CLIENT_SECRET }}
          DINKUS_E2E_GMAIL_REFRESH_TOKEN: ${{ secrets.DINKUS_E2E_GMAIL_REFRESH_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Run the journeys
        id: run
        # The inbox key reaches only this step, never the install above.
        env:
          JOURNEYS: ${{ inputs.journeys }}
          UPDATE_STORE: ${{ inputs.update_store }}
          DINKUS_E2E_BETA: ${{ inputs.beta }}
          DINKUS_E2E_HOLD: ${{ inputs.hold }}
          DINKUS_E2E_OWNER_EMAIL: ${{ secrets.DINKUS_E2E_OWNER_EMAIL }}
          DINKUS_E2E_GMAIL_CLIENT_ID: ${{ secrets.DINKUS_E2E_GMAIL_CLIENT_ID }}
          DINKUS_E2E_GMAIL_CLIENT_SECRET: ${{ secrets.DINKUS_E2E_GMAIL_CLIENT_SECRET }}
          DINKUS_E2E_GMAIL_REFRESH_TOKEN: ${{ secrets.DINKUS_E2E_GMAIL_REFRESH_TOKEN }}
        # First the store's beta plugins move to the newest betas, and the journeys run only once that
        # has passed; both sign in with the same profile, so the journeys reuse its sign-in. Everything
        # the run prints goes to the private proof, never to this public log. Its exit code goes to the
        # report step, which fails the job unless it is 0 and every journey passed. The step's own
        # limit leaves time to save the proof when a run hangs.
        timeout-minutes: 110
        run: |
          mkdir -p "$DINKUS_E2E_PROOF/$DINKUS_E2E_RUN"
          log="$DINKUS_E2E_PROOF/$DINKUS_E2E_RUN/console.log"
          : > "$log"
          code=0
          if [ "$UPDATE_STORE" = "true" ]; then
            npm run update-store >> "$log" 2>&1 || code=$?
          fi
          if [ "$code" = 0 ]; then
            npx playwright test --grep "$JOURNEYS" >> "$log" 2>&1 || code=$?
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Save the proof to R2
        if: always() && steps.run.outcome != 'skipped'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws s3 cp "$DINKUS_E2E_PROOF/$DINKUS_E2E_RUN" "s3://$R2_BUCKET/$PROOF_PREFIX/" --recursive --only-show-errors \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"

      - name: Report pass or fail
        if: always() && steps.run.outcome != 'skipped'
        env:
          # Empty when the run step was cut off, which the report counts as a failure.
          PLAYWRIGHT_CODE: ${{ steps.run.outputs.code }}
        run: |
          node scripts/run-summary.mjs "$DINKUS_E2E_PROOF/$DINKUS_E2E_RUN" "$PLAYWRIGHT_CODE" "the private R2 bucket, folder $PROOF_PREFIX/" | tee -a "$GITHUB_STEP_SUMMARY"

  # TEMPORARY: source-only until explicit owner approval. Remove before final merge.
  diagnostics-qualification:
    name: Report qualification (${{ matrix.case }})
    if: github.repository == 'dinkuskit/live-journeys' && github.event_name == 'workflow_dispatch' && inputs.diagnostics_qualification == true && github.ref == 'refs/heads/ridge/live-journey-diagnostics-20261107' && github.actor_id == '159389674' && github.run_attempt == 1 && inputs.diagnostics_expected_head == github.sha
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: allowed
            run: '42337050608'
            attempt: '1'
          - case: forbidden-workflow
            run: '42342624009'
            attempt: '1'
          - case: foreign-repository
            run: '42342657068'
            attempt: '1'
          - case: forbidden-attempt
            run: '42337050608'
            attempt: '9999'
    defaults:
      run:
        shell: bash
        working-directory: runner
    env:
      SELECTED_RUN: ${{ matrix.run }}
      SELECTED_ATTEMPT: ${{ matrix.attempt }}
      DINKUS_E2E_ENV_FILE: /dev/null
    steps:
      - name: Check out approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.0"
      - name: Pin approved reader before credentials
        id: pin
        env:
          EXPECTED_HEAD: ${{ inputs.diagnostics_expected_head }}
        run: |
          if [[ ! "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]] || [[ "$EXPECTED_HEAD" != "$GITHUB_SHA" ]] || [[ "$(git rev-parse HEAD)" != "$EXPECTED_HEAD" ]]; then
            echo 'Qualification source rejected.' >&2
            exit 1
          fi
          printf '%s  %s\n' '3797025ed95801b337efeeea86cda2e67c8b7b4b2f5ab438515cfa1e2bfcee80' 'scripts/report-diagnostics.mjs' | sha256sum --check --status
      - name: Verify selected run before any R2 read
        id: verify
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: env -i PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" GH_TOKEN="$GH_TOKEN" node scripts/report-diagnostics.mjs verify "$SELECTED_RUN" "$SELECTED_ATTEMPT"
      - name: Read only the allowed bounded report
        id: fetch
        if: steps.verify.outcome == 'success' && matrix.case == 'allowed'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: env -i PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" R2_ACCOUNT_ID="$R2_ACCOUNT_ID" R2_BUCKET="$R2_BUCKET" node scripts/report-diagnostics.mjs fetch "$SELECTED_RUN" "$SELECTED_ATTEMPT"
      - name: Publish allowlisted diagnostics without credentials
        id: analyze
        if: steps.fetch.outcome == 'success'
        run: |
          env -i PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" node scripts/report-diagnostics.mjs analyze "$SELECTED_RUN" "$SELECTED_ATTEMPT" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Remove private temporary files
        id: clean
        if: always() && steps.pin.outcome == 'success'
        run: env -i PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" node scripts/report-diagnostics.mjs clean "$SELECTED_RUN" "$SELECTED_ATTEMPT"
      - name: Assert fixed qualification outcomes
        if: always() && steps.pin.outcome == 'success'
        env:
          QUALIFICATION_CASE: ${{ matrix.case }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          CLEAN_OUTCOME: ${{ steps.clean.outcome }}
        run: |
          if [[ "$CLEAN_OUTCOME" != success ]]; then
            echo 'Qualification failed.' >&2
            exit 1
          fi
          case "$QUALIFICATION_CASE" in
            allowed)
              if [[ "$VERIFY_OUTCOME" != success || "$FETCH_OUTCOME" != success || "$ANALYZE_OUTCOME" != success ]]; then
                echo 'Qualification failed.' >&2
                exit 1
              fi
              echo 'allowed: verify, fetch, analyze and cleanup passed.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            forbidden-workflow|foreign-repository|forbidden-attempt)
              if [[ "$VERIFY_OUTCOME" != failure || "$FETCH_OUTCOME" != skipped || "$ANALYZE_OUTCOME" != skipped ]]; then
                echo 'Qualification failed.' >&2
                exit 1
              fi
              echo 'forbidden: verify rejected; fetch and analyze skipped; cleanup passed.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) echo 'Qualification failed.' >&2; exit 1 ;;
          esac
